name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 26.10.0 or 26.10.1-rc.1
        type: string
        required: true
      publish:
        description: Publish to NuGet and create the GitHub release. Off builds and verifies only.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            tag="$REF_NAME"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$version' is not a version of the form major.minor.patch[-suffix]."
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish-nuget:
    name: Publish to NuGet
    needs: [version, ci]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Set the NUGET_USER variable (trusted publishing) or the NUGET_API_KEY secret."
            exit 1
          fi
          # A .snupkg beside its .nupkg is uploaded together with it.
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub release
    needs: [version, ci, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          notes="docs/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          prerelease_args=()
          [ "$PRERELEASE" = true ] && prerelease_args=(--prerelease)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" "${notes_args[@]}" "${prerelease_args[@]}"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$VERSION" --target "$GITHUB_SHA" "${notes_args[@]}" "${prerelease_args[@]}"
          fi
